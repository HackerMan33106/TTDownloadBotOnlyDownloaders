name: Deploy Telegram Bot to VPS

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - '.dockerignore'
      - 'LICENSE'
      - '.env.example'
      - '.claude/**'
      - '.claudeignore'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TRASH_GROUP_ID: ${{ secrets.TRASH_GROUP_ID }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      PERMANENT_ADMIN: ${{ secrets.PERMANENT_ADMIN }}
      WHITELIST_USERS: ${{ secrets.WHITELIST_USERS }}
      WHITELIST_GROUPS: ${{ secrets.WHITELIST_GROUPS }}

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 30m
          envs: BOT_TOKEN,TRASH_GROUP_ID,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET,SPOTIFY_REFRESH_TOKEN,TELEGRAM_API_ID,TELEGRAM_API_HASH,PERMANENT_ADMIN,WHITELIST_USERS,WHITELIST_GROUPS
          script: |
            echo ">>> 📥 Updating code..."
            cd ~/app || exit 1

            # Обновляем репозиторий без удаления папки и без sudo
            if [ -d "TTDownloadBotOnlyDownloders" ]; then
              cd TTDownloadBotOnlyDownloders
              echo ">>> 🛑 Stopping containers..."
              docker compose down || true
              echo ">>> 🔄 Fetching latest code..."
              git remote set-url origin https://github.com/HackerMan33106/TTDownloadBotOnlyDownloaders.git
              git fetch origin main
              git reset --hard origin/main
            else
              echo ">>> 🔄 Cloning repository..."
              git clone https://github.com/HackerMan33106/TTDownloadBotOnlyDownloaders.git TTDownloadBotOnlyDownloders
              cd TTDownloadBotOnlyDownloders || exit 1
            fi

            mkdir -p ./data

            echo ">>> 📝 Creating .env file..."
            cat > .env << EOF
            BOT_TOKEN=${BOT_TOKEN}
            TRASH_GROUP_ID=${TRASH_GROUP_ID}
            SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
            SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
            SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN}
            USE_LOCAL_API=true
            LOCAL_API_URL=http://172.17.0.1:8200
            TELEGRAM_API_ID=${TELEGRAM_API_ID}
            TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
            PERMANENT_ADMIN=${PERMANENT_ADMIN}
            WHITELIST_USERS=${WHITELIST_USERS}
            WHITELIST_GROUPS=${WHITELIST_GROUPS}
            EOF

            echo ">>> 🔨 Building new Docker images..."
            docker compose build

            echo ">>> 🚀 Starting containers..."
            docker compose up -d

            echo ">>> 🧹 Cleaning up old images..."
            docker image prune -f

            echo ">>> ✅ Deployment complete!"
            echo ">>> 📊 Container status:"
            docker compose ps